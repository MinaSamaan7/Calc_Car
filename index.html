<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calc_Car</title>

    <!-- Bootstrap 5 CSS CDN (RTL Version for Arabic support) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts: Cairo -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400..700&display=swap"
      rel="stylesheet"
    />

    

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg ms-navbar py-3 sticky-top">
      <div class="container">
        <a
          class="ms-brand me-4"
          href="#"
          style="font-family: &quot;Noto Nastaliq Urdu&quot;, serif ;">حاسبة اقساط</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
        >
          <span class="navbar-toggler-icon" style="color: #ffffff"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#hero">نوع التقسيط</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#private-events">التقسيط المتاح</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#contact">التواصل</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Calculator & Content Section -->
    <main class="main-content container">
        
        <!-- Calculator Card -->
        <section id="calculator" class="card calculator-section">
            <h2><i class="fa-solid fa-calculator"></i> حاسبة الأقساط المتقدمة</h2>
            
            <form id="loanForm" style="font-family: 'Cairo', sans-serif;">
               

                <div class="form-row">
                    <div class="form-group">
                        <label for="carPrice">سعر السيارة (جنيه):</label>
                        <input type="number" id="carPrice" placeholder="أدخل السعر أو اختر من القائمة" required>
                    </div>
                    <div class="form-group">
                        <label for="downPayment">المقدم (جنيه):</label>
                        <input type="number" id="downPayment" placeholder="مقدم التعاقد" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="duration">فترة التقسيط (بالسنوات):</label>
                        <select id="duration" required>
                            <option value="1">سنة واحدة (12 شهر)</option>
                            <option value="2">سنتان (24 شهر)</option>
                            <option value="3" selected>3 سنوات (36 شهر)</option>
                            <option value="5">5 سنوات (60 شهر)</option>
                            <option value="7">7 سنوات (84 شهر)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="interestRate">فائدة سنوية (%):</label>
                        <input type="number" id="interestRate" value="12" step="0.1" required>
                    </div>
                </div>

                <button type="submit" class="btn-calculate">احسب القسط الآن</button>
            </form>
        </section>

        

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
